name: kolokal
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  # Adjusted to allow newer stable versions while respecting minimum requirement
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Utility Packages
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  intl: ^0.19.0

  # File Operations (already present and stable)
  path_provider: ^2.1.3
  permission_handler: ^11.3.1 # Still useful for requesting permissions
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
    - family: Marker
      fonts:
        - asset: assets/fonts/Marker Felt.ttf
          weight: 400