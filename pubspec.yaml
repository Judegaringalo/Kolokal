name: kolokal
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  
  # --- REPLACED: Use this instead of image_gallery_saver ---
  screenshot: ^3.0.0
  image_gallery_saver_plus: ^4.0.1  # Latest stable version

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/ 
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
    - family: Marker
      fonts:
        - asset: assets/fonts/Marker Felt.ttf
          weight: 400